x-postgres: &postgres
  image: postgres:18
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    retries: 15

x-postgres-login: &postgres-login
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

x-article-db: &article-db
  <<: *postgres
  environment:
    <<: *postgres-login
    POSTGRES_DB: articles

x-article-service: &article-service
  build: ./article-service
  environment:
    DB_USER: postgres
    DB_PASSWORD: postgres
  restart: on-failure
  depends_on:
    db-africa: { condition: service_healthy }
    db-antarctica: { condition: service_healthy }
    db-asia: { condition: service_healthy }
    db-europe: { condition: service_healthy }
    db-north-america: { condition: service_healthy }
    db-oceania: { condition: service_healthy }
    db-south-america: { condition: service_healthy }
    db-global: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  article-service-1: *article-service
  article-service-2: *article-service
  article-service-3: *article-service

  load-balancer:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on: [article-service-1, article-service-2, article-service-3]

  db-africa: *article-db
  db-antarctica: *article-db
  db-asia: *article-db
  db-europe: *article-db
  db-north-america: *article-db
  db-oceania: *article-db
  db-south-america: *article-db
  db-global: *article-db

  comment-service:
    build: ./comment-service
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: on-failure
    depends_on:
      db-comment: { condition: service_healthy }

  db-comment:
    <<: *postgres
    environment:
      <<: *postgres-login
      POSTGRES_DB: comments

  profanity-service:
    build: ./profanity-service
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: on-failure
    depends_on:
      db-profanity: { condition: service_healthy }

  db-profanity:
    <<: *postgres
    environment:
      <<: *postgres-login
      POSTGRES_DB: profanities

  draft-service:
    build: ./draft-service
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8080"
    restart: on-failure
    depends_on:
      db-draft: { condition: service_healthy }
      publisher-service: { condition: service_started }

  db-draft:
    <<: *postgres
    environment:
      <<: *postgres-login
      POSTGRES_DB: drafts

  publisher-service:
    build: ./publisher-service
    restart: on-failure
    depends_on:
      rabbitmq: { condition: service_healthy }

  newsletter-service:
    build: ./newsletter-service
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8082:8080"
    restart: on-failure
    depends_on:
      db-newsletter: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  db-newsletter:
    <<: *postgres
    environment:
      <<: *postgres-login
      POSTGRES_DB: newsletters

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5342:80"
