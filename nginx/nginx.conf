events {}
http {
  # Docker's DNS. Look the containers up again every 10 s, so recreated containers with new IPs are found
  resolver 127.0.0.11 valid=10s;

  upstream article_service {
    zone article_service 64k;
    server article-service-1:8080 resolve;
    server article-service-2:8080 resolve;
    server article-service-3:8080 resolve;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://article_service;
      proxy_set_header Host $host;
    }
  }
}
