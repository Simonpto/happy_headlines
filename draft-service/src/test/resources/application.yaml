# Tests run without Docker against an in-memory H2 database, and nothing is sent to Seq
spring:
  application:
    name: draft-service
  config:
    import: classpath:monitoring.yaml
  datasource:
    url: jdbc:h2:mem:drafts;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always

publisher:
  url: http://localhost:0

management:
  tracing:
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
