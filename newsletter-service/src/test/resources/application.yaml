# Tests run without Docker: in-memory H2, no RabbitMQ and nothing is sent to Seq
spring:
  application:
    name: newsletter-service
  config:
    import: classpath:monitoring.yaml
  datasource:
    url: jdbc:h2:mem:newsletters;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
  rabbitmq:
    listener:
      simple:
        auto-startup: false

articles:
  url: http://localhost:0

management:
  tracing:
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
