spring:
  application:
    name: article-service
  config:
    import: classpath:monitoring.yaml
  rabbitmq:
    host: rabbitmq
  # Each instance keeps its own in-memory cache. Entries expire after 30 s, so a new article
  # stored by another instance shows up here within 30 s at the latest.
  cache:
    type: caffeine
    cache-names: articles,article # named up front so their hit/miss metrics are registered
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30s,recordStats

management:
  endpoints:
    web:
      exposure:
        include: health,metrics # cache hit/miss: /actuator/metrics/cache.gets

articles:
  databases:
    africa:        jdbc:postgresql://db-africa:5432/articles
    antarctica:    jdbc:postgresql://db-antarctica:5432/articles
    asia:          jdbc:postgresql://db-asia:5432/articles
    europe:        jdbc:postgresql://db-europe:5432/articles
    north-america: jdbc:postgresql://db-north-america:5432/articles
    oceania:       jdbc:postgresql://db-oceania:5432/articles
    south-america: jdbc:postgresql://db-south-america:5432/articles
    global:        jdbc:postgresql://db-global:5432/articles
  username: ${DB_USER}
  password: ${DB_PASSWORD}
