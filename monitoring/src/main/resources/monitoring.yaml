management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${SEQ_URL:http://seq:5341}/ingest/otlp/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${SEQ_URL:http://seq:5341}/ingest/otlp/v1/logs
  otlp:
    metrics:
      export:
        enabled: false

spring:
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

logging:
  level:
    simon: DEBUG
